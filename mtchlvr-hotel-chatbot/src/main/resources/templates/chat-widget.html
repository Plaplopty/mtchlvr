<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="widget" id="hotel-chat" class="chat-root"><button id="chat-toggle" class="chat-toggle" type="button" aria-label="Open mtchlvr hotel assistant" aria-expanded="false"><span class="chat-toggle-icon">✦</span><span class="chat-pulse"></span></button><section id="chat-panel" class="chat-panel" aria-label="Hotel assistant" hidden><header class="chat-header"><span class="chat-avatar">m</span><div><strong>mtchlvr assistant</strong><small><span class="online-dot"></span> Here to help with your stay</small></div><button id="chat-close" type="button" aria-label="Close chat">×</button></header><div id="chat-messages" class="chat-messages" aria-live="polite"><div class="chat-bubble bot">Hi there 🌿 I can help with signing in, email verification, room types, reservations, cancellations, and hotel website features. What can I help you with?</div><div class="chat-suggestions"><button type="button">How do I log in?</button><button type="button">What rooms do you have?</button><button type="button">How do I book?</button></div></div><form id="chat-form" class="chat-form"><input id="chat-input" type="text" maxlength="500" placeholder="Ask about your stay…" autocomplete="off" required><button type="submit" aria-label="Send message">↑</button></form><div class="chat-footnote">Hotel help only · mtchlvr hotel</div></section></div></body></html>
