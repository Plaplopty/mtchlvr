<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify email · mtchlvr hotel</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth-body"><a class="brand auth-brand" href="/"><span class="brand-mark">m</span><span>mtchlvr <small>HOTEL</small></span></a><main class="auth-card"><span class="eyebrow">ONE QUICK STEP</span><h1>Check your <em>inbox.</em></h1><p class="muted">Enter the six-digit code sent to your email. It expires in 10 minutes.</p><div th:if="${error}" class="alert error" th:text="${error}"></div><form th:action="@{/verify}" method="post" class="stack-form"><label>Email address<input type="email" name="email" th:value="${email}" required></label><label>Verification code<input name="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="000000"></label><button class="button wide" type="submit">Verify email ↗</button></form><p class="auth-switch"><a href="/register">Back to registration</a></p></main></body></html>
