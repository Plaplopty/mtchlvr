<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rooms · mtchlvr hotel</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="page-wrap"><div th:replace="~{fragments :: alerts}"></div><span class="eyebrow">THE ROOM COLLECTION</span><h1 class="page-title">A room to call <em>yours.</em></h1><p class="lead">Four room types, three rooms of each type. Pick your dates to request a stay.</p><div class="room-grid full-grid"><article class="room-card" th:each="room : ${rooms}"><div class="room-illustration" th:classappend="${room.type.toLowerCase()}"><span class="room-tag" th:text="${room.type}">Standard</span><span class="room-number" th:text="'ROOM ' + ${room.roomNumber}">ROOM 101</span><div class="mini-arch"><div class="mini-bed"></div></div></div><div class="room-info"><div><h3 th:text="${room.type}">Standard</h3><p th:text="${room.capacity} + ' guests · Room ' + ${room.roomNumber}">2 guests</p></div><div class="price"><strong th:text="'₱' + ${#numbers.formatDecimal(room.nightlyRate,1,'COMMA',0,'POINT')}">₱1,800</strong><small>/ night</small></div></div><form th:action="@{/customer/reservations}" method="post" class="booking-form"><input type="hidden" name="roomId" th:value="${room.id}"><label>Check-in<input type="date" name="checkIn" required></label><label>Check-out<input type="date" name="checkOut" required></label><button class="button" type="submit">Request reservation ↗</button></form></article></div></main><footer><a class="brand" href="/"><span class="brand-mark">m</span><span>mtchlvr <small>HOTEL</small></span></a><span>© 2026 mtchlvr hotel</span></footer><div th:if="${#authorization.expression('hasRole(''CUSTOMER'')')}" th:replace="~{chat-widget :: widget}"></div><script src="/js/app.js"></script><script src="/js/chat.js"></script></body></html>
